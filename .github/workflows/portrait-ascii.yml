name: Gerar retrato ASCII animado
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portrait.png'
      - 'scripts/render_portrait.py'
      - '.github/workflows/portrait-ascii.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/render_portrait.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait-reveal-v4.svg
          git diff --cached --quiet || git commit -m "Gerar retrato ASCII animado"
          git pull --rebase
          git push
