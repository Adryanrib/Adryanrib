name: Refresh terminal dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - 'scripts/terminal_dashboard.py'
      - '.github/workflows/terminal-dashboard.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/terminal_dashboard.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg profile-data.json
          git diff --cached --quiet || git commit -m "Refresh terminal dashboard"
          git push
